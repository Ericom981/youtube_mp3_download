<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save a video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6edf1; --ink: #12202b; --muted: #5a6b78; --panel: #f6f9fb;
    --line: #b9c7d1; --accent: #1f4fd8; --accent-ink: #fff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a22; --ink: #e6edf1; --muted: #8fa1ae; --panel: #172530; --line: #2b3d4b; --accent: #6d94ff; --accent-ink: #0f1a22; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; min-height: 100vh; display: grid; place-items: start center; padding: 8vh 20px 40px; }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: .95; font-weight: 800; letter-spacing: -.03em; margin: 0 0 12px; }
  .lede { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; max-width: 46ch; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  input[type=url] { flex: 1; min-width: 0; font: inherit; padding: 14px 16px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; }
  input[type=url]:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 14px 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  .secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  #msg { min-height: 1.4em; margin: 12px 0 0; color: var(--muted); }
  #msg.error { color: var(--err); }
  #card { display: none; margin-top: 22px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  #card.show { display: block; }
  #card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--line); }
  .body { padding: 18px; }
  .title { font-weight: 700; font-size: 1.15rem; line-height: 1.3; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg label { padding: 10px 16px; cursor: pointer; font-weight: 600; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg input:checked + span { color: var(--accent); }
  .seg label:has(input:checked) { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: -3px; }
  select { font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  #go { margin-left: auto; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Save a video.</h1>
  <p class="lede">Paste a YouTube link, pick video or audio, and download the file.</p>

  <div class="row">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="YouTube link" autocomplete="off">
    <button id="look">Find video</button>
  </div>
  <p id="msg" role="status"></p>

  <section id="card" aria-live="polite">
    <img id="thumb" alt="">
    <div class="body">
      <p class="title" id="title"></p>
      <p class="meta" id="meta"></p>
      <div class="opts">
        <div class="seg" role="radiogroup" aria-label="Format">
          <label><input type="radio" name="type" value="mp4" checked><span>Video (MP4)</span></label>
          <label><input type="radio" name="type" value="mp3"><span>Audio (MP3)</span></label>
        </div>
        <select id="height" aria-label="Video quality">
          <option value="360">360p</option>
          <option value="480">480p</option>
          <option value="720" selected>720p</option>
          <option value="1080">1080p</option>
          <option value="best">Best available</option>
        </select>
        <button id="go">Download</button>
      </div>
    </div>
  </section>

  <footer>Only download videos you own or have permission to save.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "error" : ""; };
  const fmt = (s) => { if (!s) return ""; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
  let current = "";

  async function lookup() {
    const url = $("url").value.trim();
    if (!url) return msg("Paste a YouTube link first.", true);
    $("look").disabled = true; $("card").classList.remove("show"); msg("Finding video…");
    try {
      const r = await fetch("/api/info?url=" + encodeURIComponent(url));
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      current = url;
      $("thumb").src = d.thumbnail || "";
      $("title").textContent = d.title;
      $("meta").textContent = [d.channel, fmt(d.duration)].filter(Boolean).join(" · ");
      $("card").classList.add("show"); msg("");
    } catch (e) { msg(e.message || "Could not load that video.", true); }
    $("look").disabled = false;
  }

  async function download() {
    const type = document.querySelector("input[name=type]:checked").value;
    const q = new URLSearchParams({ url: current, type, height: $("height").value });
    $("go").disabled = true; msg("Preparing your file. Longer videos take a while…");
    try {
      const r = await fetch("/api/download?" + q);
      if (!r.ok) throw new Error((await r.json()).error);
      const blob = await r.blob();
      const name = /filename="?([^";]+)"?/.exec(r.headers.get("Content-Disposition") || "")?.[1] || "video." + type;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      URL.revokeObjectURL(a.href); msg("Done. Check your downloads.");
    } catch (e) { msg(e.message || "Download failed.", true); }
    $("go").disabled = false;
  }

  $("look").onclick = lookup;
  $("url").addEventListener("keydown", (e) => e.key === "Enter" && lookup());
  $("go").onclick = download;
  document.querySelectorAll("input[name=type]").forEach((el) => el.onchange = () => $("height").style.display = el.value === "mp3" ? "none" : "");
</script>
</body>
</html>
